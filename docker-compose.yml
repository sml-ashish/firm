services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: firm
      POSTGRES_PASSWORD: firm
      POSTGRES_DB: firm
    volumes:
      - firm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firm -d firm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://firm:firm@db:5432/firm
      SESSION_SECRET: change-me-in-production
      PORT: "3100"
    ports:
      - "3100:3100"

volumes:
  firm-db:
